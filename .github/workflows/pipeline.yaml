name: CI/CD Pipeline - Vite React to AWS EC2

# Define quando a pipeline será executada
on:
  push:
    branches: [main, release-deploy]
  pull_request:
    branches: [main]

# Variáveis de ambiente globais
env:
  NODE_VERSION: '20'
  APP_NAME: 'lunar-brecho-app'

jobs:
  # Job de Build e Qualidade de Código
  build-and-quality:
    name: Build and Quality Check
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código fonte
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Busca todo o histórico para análise de mudanças

      # 2. Setup do Node.js 20
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm' # Cache automático de dependências npm

      # 3. Cache adicional de node_modules para acelerar builds
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4. Limpar cache se necessário (opcional)
      - name: Clear npm cache if needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm cache clean --force
          echo "npm cache cleared for main branch"

      # 5. Instalar dependências
      - name: Install dependencies
        run: npm ci # ci é mais rápido e consistente que install

      # 6. Executar linter
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false # Falha o build se houver erros de lint

      # 7. Verificar formatação de código
      - name: Check code formatting
        run: npm run format -- --check
        continue-on-error: true # Apenas avisa, não falha o build

      # 8. Build da aplicação para produção
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: https://lunarbrecho.com.br/api

      # 9. Verificar se o build foi bem-sucedido
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build falhou - diretório dist não foi criado"
            exit 1
          fi
          echo "✅ Build bem-sucedido"
          echo "📦 Conteúdo do diretório dist:"
          ls -la dist/

      # 10. Upload do artefato de build para uso no deploy
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dist
          path: dist/
          retention-days: 7 # Mantém por 7 dias

      # 11. Limpeza final do ambiente
      - name: Cleanup workspace
        if: always() # Executa sempre, mesmo se houver falhas
        run: |
          rm -rf node_modules/.cache
          echo "Workspace cleaned successfully"

  # Job de Deploy para EC2 (só executa em push para main)
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: prd
    needs: build-and-quality # Aguarda o job de build terminar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.ref == 'refs/heads/release-deploy' && github.event_name == 'push'

    steps:
      # 1. Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Download do artefato de build
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dist
          path: dist/

      # 3. Criar arquivo compactado para upload
      - name: Create deployment package
        run: |
          cd dist
          tar -czf ../app-dist.tar.gz .
          cd ..
          echo "📦 Pacote criado: $(ls -lh app-dist.tar.gz)"

      # 4. Upload do arquivo de configuração Nginx
      - name: Upload Nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: 'infra/nginx-lunar-brecho.conf'
          target: '/tmp/'
          strip_components: 0

      # 5. Upload do pacote de build para EC2
      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: 'app-dist.tar.gz'
          target: '/tmp/'

      # 6. Deploy via SSH para EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            echo "🚀 Iniciando deploy do frontend..."

            # Definir diretório da aplicação
            APP_DIR="/var/www/${{ env.APP_NAME }}"
            BACKUP_DIR="/var/www/backups/${{ env.APP_NAME }}"

            # Criar backup da versão atual (se existir)
            if [ -d "$APP_DIR" ]; then
              echo "💾 Criando backup da versão atual..."
              sudo mkdir -p "$BACKUP_DIR"
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              sudo tar -czf "$BACKUP_DIR/backup-$TIMESTAMP.tar.gz" -C "$APP_DIR" . 2>/dev/null || true
              
              # Manter apenas os 5 backups mais recentes
              cd "$BACKUP_DIR"
              ls -t backup-*.tar.gz | tail -n +6 | xargs -r sudo rm --
              echo "✅ Backup criado: backup-$TIMESTAMP.tar.gz"
            fi

            # Criar diretório da aplicação se não existir
            echo "📁 Preparando diretório da aplicação..."
            sudo mkdir -p "$APP_DIR"

            # Remover conteúdo antigo
            echo "🗑️  Removendo versão antiga..."
            sudo rm -rf "$APP_DIR"/*

            # Verificar se o pacote foi enviado
            if [ ! -f "/tmp/app-dist.tar.gz" ]; then
              echo "❌ Arquivo de deploy não encontrado em /tmp/app-dist.tar.gz"
              exit 1
            fi

            # Extrair novo build
            echo "📦 Extraindo novo build..."
            sudo tar -xzf /tmp/app-dist.tar.gz -C "$APP_DIR"

            # Verificar se a extração foi bem-sucedida
            if [ ! -f "$APP_DIR/index.html" ]; then
              echo "❌ Falha na extração - index.html não encontrado"
              ls -la "$APP_DIR"
              exit 1
            fi

            echo "✅ Build extraído com sucesso"
            echo "📋 Conteúdo do diretório:"
            ls -la "$APP_DIR"

            # Ajustar permissões
            echo "🔐 Ajustando permissões..."
            sudo chown -R www-data:www-data "$APP_DIR"
            sudo chmod -R 755 "$APP_DIR"
            sudo find "$APP_DIR" -type f -exec chmod 644 {} \;

            echo "✅ Permissões ajustadas"

            # Atualizar configuração do Nginx se existir
            if [ -f "/tmp/infra/nginx-lunar-brecho.conf" ]; then
              echo "⚙️  Atualizando configuração do Nginx..."
              
              # Limpar todos os sites habilitados para evitar conflitos
              echo "🧹 Limpando configurações existentes do Nginx..."
              sudo rm -f /etc/nginx/sites-enabled/*
              
              # Verificar se há arquivos de configuração conflitantes
              echo "🔍 Verificando configurações conflitantes..."
              sudo find /etc/nginx -name "*.conf" -exec grep -l "lunarbrecho.com.br" {} \; 2>/dev/null || true
              
              # Copiar nova configuração
              sudo cp /tmp/infra/nginx-lunar-brecho.conf /etc/nginx/sites-available/${{ env.APP_NAME }}
              sudo ln -sf /etc/nginx/sites-available/${{ env.APP_NAME }} /etc/nginx/sites-enabled/
              
              # Testar configuração do Nginx
              echo "🧪 Testando configuração do Nginx..."
              if sudo nginx -t; then
                echo "✅ Configuração do Nginx válida"
                sudo systemctl reload nginx
                echo "✅ Nginx recarregado"
              else
                echo "⚠️  Erro na configuração do Nginx"
                echo "📋 Detalhes do erro:"
                sudo nginx -t
                echo "📋 Configurações ativas:"
                sudo ls -la /etc/nginx/sites-enabled/
                exit 1
              fi
            fi

            # Limpar arquivos temporários
            echo "🧹 Limpando arquivos temporários..."
            rm -f /tmp/app-dist.tar.gz
            sudo rm -rf /tmp/infra/

            # Verificar se o backend está rodando
            echo "🔍 Verificando status do backend..."
            if sudo systemctl is-active --quiet lunar-backend 2>/dev/null; then
              echo "✅ Backend está ativo"
            elif sudo systemctl is-active --quiet java-backend 2>/dev/null; then
              echo "✅ Backend Java está ativo"
            elif netstat -tlnp | grep -q ":8080"; then
              echo "✅ Serviço rodando na porta 8080"
            else
              echo "⚠️  Backend não detectado na porta 8080"
              echo "📋 Processos na porta 8080:"
              netstat -tlnp | grep ":8080" || echo "Nenhum processo encontrado"
              echo "📋 Serviços systemd relacionados:"
              sudo systemctl list-units --type=service | grep -E "(lunar|backend|java)" || echo "Nenhum serviço encontrado"
            fi

            echo "✅ Deploy concluído com sucesso!"

      # 7. Verificação de saúde da aplicação
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            echo "🔍 Verificando saúde da aplicação..."

            # Aguardar Nginx processar
            sleep 15

            # Verificar se o Nginx está rodando
            if ! sudo systemctl is-active --quiet nginx; then
              echo "❌ Nginx não está ativo!"
              sudo systemctl status nginx --no-pager
              exit 1
            fi

            echo "✅ Nginx está ativo"

            # Verificar se os arquivos foram deployados corretamente
            if [ ! -f "/var/www/${{ env.APP_NAME }}/index.html" ]; then
              echo "❌ Arquivo index.html não encontrado!"
              echo "📋 Conteúdo do diretório:"
              ls -la /var/www/${{ env.APP_NAME }}/
              exit 1
            fi

            echo "✅ Arquivos de deploy encontrados"

            # Testar acesso local ao site com múltiplas estratégias
            max_attempts=8
            attempt=1
            success=false

            while [ $attempt -le $max_attempts ] && [ "$success" = false ]; do
              echo "🔄 Tentativa $attempt de $max_attempts..."

              # Estratégia 1: Testar HTTP local
              response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")
              echo "📊 Status HTTP local: $response"

              # Estratégia 2: Testar HTTPS local (se certificado estiver disponível)
              if [ -f "/etc/letsencrypt/live/lunarbrecho.com.br/fullchain.pem" ]; then
                https_response=$(curl -s -k -o /dev/null -w "%{http_code}" https://localhost/ 2>/dev/null || echo "000")
                echo "📊 Status HTTPS local: $https_response"
              fi

              # Estratégia 3: Testar IP público
              public_response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/ 2>/dev/null || echo "000")
              echo "📊 Status IP público: $public_response"

              # Considerar sucesso se qualquer uma das estratégias funcionar
              if [ "$response" = "200" ] || [ "$response" = "304" ] || [ "$public_response" = "200" ] || [ "$public_response" = "304" ]; then
                echo "✅ Aplicação está respondendo!"
                
                # Verificar se o conteúdo está sendo servido
                if curl -s http://localhost/ | grep -q -i "lunar\|brecho\|react\|html"; then
                  echo "✅ Conteúdo sendo servido corretamente"
                  success=true
                else
                  echo "⚠️  Resposta recebida mas conteúdo pode estar incorreto"
                  # Não falhar imediatamente, continuar tentando
                fi
              fi

              if [ "$success" = false ]; then
                echo "⏳ Aguardando 15 segundos antes da próxima tentativa..."
                sleep 15
                attempt=$((attempt + 1))
              fi
            done

            if [ "$success" = true ]; then
              echo "🎉 Health check passou com sucesso!"
              exit 0
            else
              echo "❌ Health check falhou após $((max_attempts * 15)) segundos"
              echo "📋 Diagnóstico detalhado:"
              echo "📋 Status do Nginx:"
              sudo systemctl status nginx --no-pager
              echo "📋 Logs do Nginx (últimas 20 linhas):"
              sudo tail -n 20 /var/log/nginx/error.log 2>/dev/null || echo "Log não encontrado"
              echo "📋 Teste de conectividade:"
              curl -I http://localhost/ 2>/dev/null || echo "Falha na conectividade local"
              echo "📋 Arquivos no diretório da aplicação:"
              ls -la /var/www/${{ env.APP_NAME }}/
              echo "📋 Configuração do Nginx ativa:"
              sudo nginx -T 2>/dev/null | grep -A 5 -B 5 "server_name" || echo "Configuração não encontrada"
              
              # Não falhar o deploy se o site estiver funcionando externamente
              echo "⚠️  Health check falhou, mas verificando se o site está acessível externamente..."
              external_test=$(curl -s -o /dev/null -w "%{http_code}" https://lunarbrecho.com.br/ 2>/dev/null || echo "000")
              if [ "$external_test" = "200" ] || [ "$external_test" = "304" ]; then
                echo "✅ Site está acessível externamente! Health check considerado como sucesso."
                exit 0
              else
                echo "❌ Site não está acessível externamente"
                exit 1
              fi
            fi

  # Job de notificação (opcional)
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-quality, deploy]
    if: always() # Executa sempre, mesmo se outros jobs falharem

    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        run: |
          echo "🎉 Deploy do frontend realizado com sucesso!"
          echo "📱 Aplicação: ${{ env.APP_NAME }}"
          echo "🌐 Acesse em: http://${{ secrets.EC2_HOST }}"
          # Aqui você pode adicionar notificações para Slack, Discord, etc.

      - name: Notify Failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deploy do frontend falhou!"
          echo "📱 Aplicação: ${{ env.APP_NAME }}"
          # Aqui você pode adicionar notificações de erro
