server {
    listen 80;
    listen [::]:80;
    
    # Substitua pelo seu domínio ou IP
    server_name lunarbrecho.com.br www.lunarbrecho.com.br;
    
    # Diretório raiz da aplicação
    root /var/www/lunar-brecho-app;
    index index.html;

    # Logs
    access_log /var/log/nginx/lunar-brecho-access.log;
    error_log /var/log/nginx/lunar-brecho-error.log;

    # Compressão Gzip para melhor performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json
               image/svg+xml;

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Desabilitar cache para index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy para API backend (se necessário)
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA - Todas as rotas devem retornar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança - Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Desabilitar acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Bloco HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name lunarbrecho.com.br www.lunarbrecho.com.br;
    
    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/lunarbrecho.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunarbrecho.com.br/privkey.pem;
    
    # Configurações SSL modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Diretório raiz da aplicação
    root /var/www/lunar-brecho-app;
    index index.html;

    # Logs
    access_log /var/log/nginx/lunar-brecho-access.log;
